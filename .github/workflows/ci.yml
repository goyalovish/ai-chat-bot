name: Campus RAG CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Verify Code Syntax
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Ingestion Data Output
        run: |
          python -c "import json, os; assert os.path.exists('data/processed/chunks.json'), 'chunks.json exists'; data = json.load(open('data/processed/chunks.json')); assert len(data) > 0, 'Chunks populated'"
          echo "Data ingestion pipeline verified successfully!"