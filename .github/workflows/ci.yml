name: Campus RAG CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber pypdf flake8

      - name: Verify Code Syntax
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Ingestion Pipeline
        run: |
          python ingestion/run_ingest.py

      - name: Verify Processed Chunks
        run: |
          python -c "import json, os; assert os.path.exists('data/processed/chunks.json'); data = json.load(open('data/processed/chunks.json')); assert len(data) > 0; print(f'Successfully verified {len(data)} chunks!')"